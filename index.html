<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tank Prototype</title>
<style>
body { margin:0; overflow:hidden; background:#111; }
canvas { background:#222; display:block; margin:auto; }
</style>
</head>
<body>

<canvas id="game" width="900" height="600"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const keys = {};
const bullets = [];

const tank = {
    x: 450,
    y: 300,
    size: 40,
    speed: 3,
    turretAngle: 0
};

const obstacles = [
    {x:200,y:200,w:80,h:80},
    {x:600,y:150,w:100,h:50},
    {x:400,y:450,w:120,h:40}
];

const walls = [
    {x:0,y:0,w:900,h:20},
    {x:0,y:580,w:900,h:20},
    {x:0,y:0,w:20,h:600},
    {x:880,y:0,w:20,h:600}
];

let mouse = {x:0,y:0};

document.addEventListener("keydown", e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup", e=>keys[e.key.toLowerCase()]=false);

canvas.addEventListener("mousemove", e=>{
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener("mousedown", ()=>{
    shoot();
});

function shoot(){

    const speed = 8;

    bullets.push({
        x: tank.x,
        y: tank.y,
        vx: Math.cos(tank.turretAngle) * speed,
        vy: Math.sin(tank.turretAngle) * speed,
        size:6
    });

}

function rectCollision(a,b){
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
}

function update(){

    let dx = 0;
    let dy = 0;

    if(keys["w"]) dy -= tank.speed;
    if(keys["s"]) dy += tank.speed;
    if(keys["a"]) dx -= tank.speed;
    if(keys["d"]) dx += tank.speed;

    const next = {
        x:tank.x + dx - tank.size/2,
        y:tank.y + dy - tank.size/2,
        w:tank.size,
        h:tank.size
    };

    let blocked = false;

    [...walls,...obstacles].forEach(o=>{
        if(rectCollision(next,o)) blocked=true;
    });

    if(!blocked){
        tank.x += dx;
        tank.y += dy;
    }

    tank.turretAngle = Math.atan2(mouse.y - tank.y, mouse.x - tank.x);

    bullets.forEach((b,i)=>{

        b.x += b.vx;
        b.y += b.vy;

        const rect = {x:b.x,y:b.y,w:b.size,h:b.size};

        [...walls,...obstacles].forEach(o=>{
            if(rectCollision(rect,o)){
                bullets.splice(i,1);
            }
        });

    });

}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#555";

    walls.forEach(w=>{
        ctx.fillRect(w.x,w.y,w.w,w.h);
    });

    ctx.fillStyle = "#666";

    obstacles.forEach(o=>{
        ctx.fillRect(o.x,o.y,o.w,o.h);
    });

    ctx.fillStyle = "#0f0";
    ctx.fillRect(
        tank.x - tank.size/2,
        tank.y - tank.size/2,
        tank.size,
        tank.size
    );

    ctx.save();
    ctx.translate(tank.x,tank.y);
    ctx.rotate(tank.turretAngle);

    ctx.fillStyle = "#0ff";
    ctx.fillRect(0,-5,40,10);

    ctx.restore();

    ctx.fillStyle = "#ff0";

    bullets.forEach(b=>{
        ctx.fillRect(b.x,b.y,b.size,b.size);
    });

}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
